[workspace]
resolver = "2"
members = ["crates/marginalia-types", "crates/marginalia-text", "crates/marginalia-chunk", "crates/marginalia-parse", "crates/marginalia-works", "crates/marginalia-ret", "crates/marginalia-io", "crates/marginalia-history", "crates/marginalia-py"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

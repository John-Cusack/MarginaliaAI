# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews PRs through its GitHub App; nothing here runs in Actions.
# It reads this file from the PR's own branch, so an edit applies to the PR
# that makes it. `.github/workflows/coderabbit-config.yml` validates it.
#
# Only settings that differ from CodeRabbit's defaults, or that the CI
# integration depends on, are written out. `@coderabbitai configuration` on a
# PR prints the full resolved config.

language: en-US

tone_instructions: >-
  Be direct and specific. Lead with the defect and what it breaks. No praise,
  no restating the diff. If unsure whether something is a bug, say so and name
  what would confirm it.

reviews:
  # chill reviews for bugs, security and the path rules below, and leaves
  # style alone; ruff already gates style in CI. Try assertive once a few
  # reviews have shown what chill misses.
  profile: chill

  # Off until the pre-merge checks below earn `error` mode. Turned on, it has
  # CodeRabbit request changes on actionable findings and approve once they
  # are resolved.
  request_changes_workflow: false

  # PR descriptions here are written by hand. By default CodeRabbit writes its
  # summary into the description; this keeps it in its own walkthrough comment.
  high_level_summary_in_walkthrough: true

  # One maintainer, so there is nobody to suggest.
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - WIP

  path_filters:
    # 780 KB of resolver output. A dependency change shows up in pyproject.toml.
    - "!uv.lock"

  # Every rule below is taken from what the code does today, not from the
  # design docs. Where the two disagree, the docs have drifted.
  path_instructions:
    - path: "packages/core/src/research_engine/{modules,services/ingestion}/**"
      instructions: |
        Ingestion, parsing and chunking. Passage offsets are the address every
        other feature uses.
        - Every passage must satisfy `text == canonical_text[char_start:char_end]`.
          Offsets index the stored canonical text, not `normalized_text`.
        - If a change alters the canonical text a parser emits, every offset for
          that format moves and already-ingested documents need re-ingesting.
          Flag it unless the PR shows the text is byte-for-byte unchanged or says
          re-ingest is required.
        - A chunker whose output changes must bump its `version` so `reindex`
          marks its passages stale.
        - A module returning `"structural"` from `default_chunker()` must also
          supply `metadata["sections"]`. Without it `run_chunking` falls back to
          prose windows and the structure is silently lost.
        - Dedup is sha256 of the file bytes plus `source`, backed by a unique
          constraint. Metadata must not enter the hash.

    - path: "packages/core/src/research_engine/services/text/normalize.py"
      instructions: |
        Bump `NORMALIZATION_VERSION` whenever `normalize` output changes for any
        input.

    - path: "packages/core/src/research_engine/services/extraction/**"
      instructions: |
        Bump `EXTRACTOR_VERSION` (caching.py) when a change alters what a run
        produces from unchanged inputs: output contract, validation or anchoring.
        Without the bump, stale cached extractions keep matching.

    - path: "packages/core/src/research_engine/adapters/storage/postgres/migrations/versions/**"
      instructions: |
        Hand-written Alembic migrations, never autogenerated.
        - File named `NNN_snake_case.py`. `revision` equals the file stem and
          `down_revision` is the previous stem. Check for gaps and duplicates.
        - Opens with a docstring saying why the change is needed.
        - Tables live in the `core` schema; pass `schema="core"`.
        - `downgrade()` is implemented.
        - `adapters/storage/postgres/schema.py` changes in step.
          `tests/integration/test_schema_truthfulness.py` compares the two, and
          it does not run in CI, so check by reading.
        - No data backfills in a migration. Add columns nullable and repair
          through a CLI command (`research-engine reindex`,
          `research-engine embeddings backfill`). A migration that needs data
          in a given shape checks for it and raises naming the command to run,
          as `006_vector_index.py` does.

    - path: "packages/{core/src/research_engine/plugins,sdk}/**"
      instructions: |
        The permission boundary between packs and core.
        - A pack gets only the clients its manifest permissions grant. The rest
          are `Denied*` stubs (`plugins/permissions.py`), and network access
          goes through `GatedHttpClient`'s allowlist. Flag any path that hands a
          pack a real client, the container, or a session it did not declare.
        - A method added to a client protocol needs the same method on the
          matching `Denied*` stub.
        - Duplicate ids for document types, chunkers, ingestion modules, MCP
          tools, filter extensions and source searches must keep raising
          `PluginConflict`.
        - A pack's top-level package may not shadow a stdlib module or another
          pack's package.
        - A breaking change to the SDK surface needs a CHANGELOG entry naming
          the `requires.core_api` range packs must move to.
        - The `filesystem` and `subprocess` permissions are declared but not
          enforced. Don't describe them as a sandbox or rely on them.

    - path: "packages/core/src/research_engine/mcp/tools/**"
      instructions: |
        MCP tools are the agent-facing contract.
        - A tool module defines `TOOL_NAME`, `TOOL_DESCRIPTION`, `TOOL_SCHEMA`
          and `async def handler(container, *, ...)` returning a dict. It must
          be listed in `CORE_TOOL_MODULES` in `mcp/dispatch.py`; a module that
          is not listed is never served.
        - Failures return `{"error": {"code", "message", "details"}}` with code
          `not_found`, `invalid_input` or `<tool>_failed`. They are not raised.
        - Dispatch validates only required fields, top-level types and enums.
          Anything deeper is the handler's job.
        - The agent sees only `TOOL_SCHEMA` and `TOOL_DESCRIPTION`. Flag a
          behavior change that leaves either one describing the old behavior.

    - path: "packages/core/src/research_engine/config/**"
      instructions: |
        Settings use the `RE_` env prefix. Secrets are `SecretStr` and are listed
        in `SECRET_FIELDS`, so they print as set/unset and never as values.

    - path: "tests/unit/**"
      instructions: |
        CI runs these with no database, no network, no GPU and no model weights.
        Flag anything that reaches for one: a real engine or `RE_DB_URL`, an
        HTTP call, or loading an embedding, reranker or Docling model. That work
        belongs in tests/integration. `asyncio_mode = auto`, so no asyncio marker
        is needed.

    - path: "tests/integration/**"
      instructions: |
        - Use the `engine` and `corpus` fixtures from conftest.py. Database URLs
          go through `research_engine.testing.resolve_test_db_url` so a test
          never touches the real corpus.
        - The autouse `corpus_is_unchanged` guard fails a session that leaves
          the corpus modified, so clean up what a test creates.
        - These do not run in CI. If a PR's correctness rests on them, say so.

    - path: "packages/plugins/**"
      instructions: |
        In-tree packs get no privilege an external pack would not. Review them
        against the permissions in their own `pack.yaml`. Their tests run in CI,
        and any database URL goes through `resolve_test_db_url`.

    - path: "**/*.py"
      instructions: |
        - Log with structlog: a static snake_case event name plus keyword fields,
          e.g. `logger.warning("structural_sections_missing", parser=...)`.
          Never an f-string message.
        - Raise subclasses of `ResearchEngineError` from `domain/errors.py`;
          packs use `plugins/sdk/errors.py`.
        - ruff (ruff.toml) already runs in CI. Don't repeat its findings.

    - path: "CHANGELOG.md"
      instructions: |
        Unreleased entries go at the top, newest first, as a `###` sentence-style
        headline followed by prose explaining the problem and the fix. Released
        sections are `## X.Y.Z — YYYY-MM-DD`. Check every concrete claim in an
        entry against the diff: counts, names, and statements such as "no
        re-ingest needed".

    - path: ".github/workflows/**"
      instructions: |
        - Pin every action to a full commit SHA with its release as a trailing
          comment. Keep `permissions` minimal and set `persist-credentials: false`
          on checkout.
        - The CI workflow stays hermetic: no secrets, database or GPU. Integration
          tests are left out on purpose (see the note at the end of ci.yml), so
          don't suggest adding them.

    - path: "corpus-engine-docs/**"
      instructions: |
        Design documents written ahead of the code, and parts have drifted: not
        every layering rule in 11-implementation-architecture.md is followed,
        and the OS keyring it describes does not exist. Where code and a doc
        disagree, don't assume the code is wrong. Do flag a change to documented
        behavior that leaves the doc describing the old behavior.

  pre_merge_checks:
    # 42% of functions and classes under packages/ have docstrings. The default
    # 80% threshold would warn on nearly every PR and mean nothing.
    # Quoted because YAML 1.1 parsers read a bare `off` as false.
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        A plain-English, sentence-case description of the change in behavior,
        e.g. "Keep the author a PDF names, when it names one". No
        conventional-commit prefix (feat:, fix:), no ticket id, no trailing
        period, at most 72 characters.
    # Custom checks need CodeRabbit's Team plan or above. This repo runs on
    # Advanced, as the run configuration CodeRabbit posted on #23 shows. Both
    # start as warnings. Move one to `error`, together with
    # `request_changes_workflow`, once it has proven accurate.
    custom_checks:
      - name: CHANGELOG entry
        mode: warning
        instructions: >-
          Pass if CHANGELOG.md gains or updates an entry at the top, or if the
          PR changes nothing a user of the engine or a pack author would notice.
          CI, tooling, repo config, docs-only and test-only changes pass. Fail
          if files under packages/ change runtime behavior (ingestion, search,
          extraction, MCP tools, CLI, plugin SDK, migrations) and CHANGELOG.md
          is untouched.
      - name: Re-ingest impact stated
        mode: warning
        instructions: >-
          Applies only if the diff changes the canonical text a parser emits
          (packages/core/src/research_engine/modules/), chunker output or a
          chunker `version`, `NORMALIZATION_VERSION` or `EXTRACTOR_VERSION`, or
          adds a migration. Pass if none of these apply. Otherwise pass only if
          the PR description says what an existing corpus needs, and why:
          nothing, `reindex`, a backfill command, or re-ingest.

  tools:
    # Uses ruff.toml, the same config CI gates on.
    ruff:
      enabled: true
    # Reads failed GitHub Actions runs back into the review and comments on the
    # lines that broke them.
    github-checks:
      enabled: true
    # Uses .markdownlint.yaml, which encodes CHANGELOG.md's heading layout.
    markdownlint:
      enabled: true

code_generation:
  unit_tests:
    path_instructions:
      - path: "**/*.py"
        instructions: |
          pytest with `asyncio_mode = auto`. Put tests under tests/unit, next
          to the existing file for the same area. Keep them hermetic: fakes
          instead of a database, the network or model weights. Build inputs
          from the real shapes that exposed the bug, not placeholder strings.

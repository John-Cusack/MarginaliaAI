[project]
name = "research-engine-workspace"
version = "0.2.0"
description = "Corpus Engine workspace root"
requires-python = ">=3.11"
dependencies = [
    "research-engine[full]",
    "research-engine-sdk",
    "research-engine-plugin-history",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "easyocr>=1.7",
    # Exercises the embed-server in tests. On the GPU host itself it comes from
    # the research-engine `embed-server` extra.
    "fastapi>=0.110",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.uv.workspace]
members = ["packages/core", "packages/sdk", "packages/plugins/history"]

[tool.uv.sources]
research-engine = { workspace = true }
research-engine-sdk = { workspace = true }
research-engine-plugin-history = { workspace = true }

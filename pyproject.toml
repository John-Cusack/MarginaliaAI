[project]
name = "marginalia-ai-workspace"
version = "0.2.0"
description = "Corpus Engine workspace root"
requires-python = ">=3.11"
dependencies = [
    "marginalia-ai[full]",
    "marginalia-ai-sdk",
    "marginalia-ai-plugin-history",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "easyocr>=1.7",
    # Exercises the embed-server in tests. On the GPU host itself it comes from
    # the marginalia-ai `embed-server` extra.
    "fastapi>=0.110",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.uv.workspace]
members = ["packages/core", "packages/sdk", "packages/plugins/history"]

[tool.uv.sources]
marginalia-ai = { workspace = true }
marginalia-ai-sdk = { workspace = true }
marginalia-ai-plugin-history = { workspace = true }

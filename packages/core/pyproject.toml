[project]
name = "research-engine"
version = "0.5.0"
description = "Corpus Engine — turn a personal library into a research superpower"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    "anthropic>=0.40,<1",
    "openai>=1.10,<2",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "jinja2>=3.1,<4",
    "mcp>=1.0,<2",
    "pyyaml>=6,<7",
    "sentence-transformers>=3.0,<4",
    "tiktoken>=0.7,<1",
    "pymupdf>=1.24,<2",
    "ebooklib>=0.18,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.1,<6",
    "structlog>=24.1,<25",
    "uuid-utils>=0.9,<1",
    "docling>=2.70,<3",
    "packaging>=23.0",
]

[project.optional-dependencies]
# Only needed on the machine running `research-engine embed-server`.
embed-server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "fastapi>=0.110",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "testcontainers[postgres]>=4,<5",
    "ruff>=0.5,<1",
]

[project.scripts]
research-engine = "research_engine.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_engine"]

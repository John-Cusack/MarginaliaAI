[project]
name = "marginalia-ai"
dynamic = ["version"]
description = "Build a searchable, citable research corpus and expose it over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MarginaliaAI" }]
keywords = ["citations", "corpus", "information-retrieval", "mcp", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "marginalia-ai-sdk>=0.6.1,<0.7",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    "anthropic>=0.40,<1",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "jinja2>=3.1,<4",
    "mcp>=1.0,<2",
    "pyyaml>=6,<7",
    "structlog>=24.1,<25",
    "uuid-utils>=0.9,<1",
    "packaging>=23",
]

[project.optional-dependencies]
openai = [
    "openai>=1.10,<2",
]
local-inference = [
    "sentence-transformers>=3.0,<4",
]
documents = [
    "pymupdf>=1.24,<2",
    "ebooklib>=0.18,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.1,<6",
]
document-ai = [
    "docling>=2.70,<3",
]
embed-server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sentence-transformers>=3.0,<4",
]
full = [
    "openai>=1.10,<2",
    "sentence-transformers>=3.0,<4",
    "pymupdf>=1.24,<2",
    "ebooklib>=0.18,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.1,<6",
    "docling>=2.70,<3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "fastapi>=0.110",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "testcontainers[postgres]>=4,<5",
    "ruff>=0.5,<1",
]

[project.scripts]
research-engine = "research_engine.cli.main:app"

[project.urls]
Homepage = "https://github.com/John-Cusack/MarginaliaAI"
Source = "https://github.com/John-Cusack/MarginaliaAI"
Issues = "https://github.com/John-Cusack/MarginaliaAI/issues"
Changelog = "https://github.com/John-Cusack/MarginaliaAI/blob/main/CHANGELOG.md"
Documentation = "https://github.com/John-Cusack/MarginaliaAI/tree/main/docs"

# The wheel carries a native extension, `research_engine._native`, built from
# crates/marginalia-py: every install gets the Rust paths (see
# `research_engine._rust`). maturin takes the version from that crate's
# Cargo.toml, which a unit test keeps equal to `research_engine.__version__`.
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../crates/marginalia-py/Cargo.toml"
python-source = "src"
module-name = "research_engine._native"
bindings = "pyo3"
features = ["extension-module"]
# A local tree carries bytecode caches; the wheel must not.
exclude = ["**/__pycache__/**", "**/*.pyc"]

# uv reinstalls this editable package when any of these change, so a Rust
# edit is rebuilt on the next `uv sync` / `uv run`.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { file = "../../crates/**/Cargo.toml" },
    { file = "../../crates/**/*.rs" },
]

[project]
name = "research-engine-sdk"
version = "0.1.0"
description = "Plugin SDK for Corpus Engine"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_engine_sdk"]

id: claims
version: 1
description: |
  Extract claims, opinions, and assertions made in correspondence.
  Useful for tracking sentiment and political stance over time.
owner: pack:history

record_types:
  - id: claim
    description: A claim or assertion made by the author
    fields:
      claim_type:
        type: enum
        values: [factual_claim, opinion, prediction, request, instruction]
        required: true
      topic:
        type: string
        description: "Brief topic or subject of the claim"
        required: true
      stance:
        type: number
        range: [-1, 1]
        description: "Sentiment: -1 (negative) to +1 (positive)"
        required: false
      target_entity_surface:
        type: string
        description: "Person or entity the claim is about, as written"
        required: false
      target_entity_id:
        type: entity_ref
        entity_type: person
        required: false
      evidence:
        type: evidence_span
        description: "Exact substring supporting this claim"
        required: true
      confidence:
        type: number
        range: [0, 1]
        required: true

prompt: |
  You are extracting claims, opinions, and assertions from historical
  correspondence.

  For each claim found, produce a record of type `claim`.

  Rules:
  - The `evidence` field MUST be a verbatim substring of the passage.
  - Distinguish factual claims from opinions and predictions.
  - Assign stance as sentiment toward the topic: -1 very negative,
    0 neutral, +1 very positive.
  - Be conservative with confidence.

  Passage:
  """
  {{ passage_text }}
  """

  Entity hints:
  {{ entity_hints }}

  Output JSON matching the schema.

validation:
  evidence_must_be_substring: true
  evidence_max_length: 300

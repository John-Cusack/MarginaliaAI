  - key: lectures-on-faith-1835
    title: Lectures on Faith, as printed in the 1835 Doctrine and Covenants
    work: lectures-on-faith
    date_published: "1835"
    acquire:
      method: manual
      url: https://www.josephsmithpapers.org/paper-summary/doctrine-and-covenants-1835/1
      license: "© Intellectual Reserve (transcription) — private research use only"
      notes: >-
        The operator opens the 1835 Doctrine and Covenants at the Joseph Smith
        Papers, chooses "View entire transcript", and saves the page as HTML
        into the inbox. Only the lectures (printed pages 5–74) are loaded,
        one unit per numbered paragraph, located by lecture and page.
    select: {printed_pages: [5, 74]}
    expect: {lecture: 7}
    verify: [paragraph numbering, page breaks preserved]
    notes: >-
      A separate edition from dc-1835 so its standing can end in 1921 while
      the revelations' does not; both are read from the same transcript.


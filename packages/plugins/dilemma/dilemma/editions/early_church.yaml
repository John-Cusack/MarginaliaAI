group: early_church
title: Joseph Smith and early-church documents
brief: >-
  The Joseph Smith Papers series, every First Vision account, the King Follett
  Discourse in each reporter's version stored separately, the Sermon in the
  Grove, the Lectures on Faith, History of the Church and the early
  periodicals. The Joseph Smith Papers is governed by the Church's terms of
  use, which forbid any robot or automated access: its transcripts are saved
  by the operator for personal, noncommercial use ("View entire transcript",
  then save the page) into the source's inbox, and loaded from there. The
  pipeline never fetches from it.
sources:
  # --- Joseph Smith Papers series -------------------------------------------
  - key: jsp-journals
    title: Joseph Smith Papers — Journals
    work: jsp-journals
    acquire: {method: manual, url: https://www.josephsmithpapers.org}
    verify: [terms of use for bulk access, license]

  - key: jsp-documents

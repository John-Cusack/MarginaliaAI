              license: "© Intellectual Reserve — private research use only"}
    verify: [terms of use, robots.txt]

  - key: gc-1976-10-kimball-our-own-liahona
    title: Spencer W. Kimball, "Our Own Liahona", October 1976 general conference
    work: gc-1976-10-kimball-our-own-liahona
    author: Spencer W. Kimball
    date_composed: "1976-10-03"
    date_published: "1976-11"
    acquire:
      method: manual
      url: https://www.churchofjesuschrist.org/study/general-conference/1976/10/our-own-liahona?lang=eng
      license: "© Intellectual Reserve — private research use only"
      notes: >-
        The Church's terms forbid automated access but allow personal
        downloads: the operator saves the page as HTML into the inbox.
    verify: [that this is the address the gold set means, exact wording]


group: leadership
title: Post-Smith leadership and official statements
brief: >-
  Journal of Discourses, Conference Reports, First Presidency statements,
  the Gospel Topics essays (every recoverable revision, e.g. from the Wayback
  Machine) and church-published reference works. Attach to the Journal of
  Discourses the authority caveats the church itself raises — they feed the
  "speaking as a man" hatch. Church website content is © Intellectual Reserve:
  private research use only, and respect its terms and robots.txt.
sources:
  - key: journal-of-discourses
    title: Journal of Discourses (26 vols, 1854–1886)
    work: journal-of-discourses
    date_published: "1854-1886"
    acquire: {method: scrape, license: public domain (verify the copy's terms),
              notes: "archive.org scans volume by volume; units are paragraphs, located by volume and page."}
    verify: [url, OCR accuracy, page breaks preserved]

  - key: jd-1852-04-09-young
    title: >-
      Brigham Young, "Self-Government—Mysteries, etc.", 9 April 1852,
      Journal of Discourses 1:46–53
    work: jd-1852-04-09-young
    author: Brigham Young
    date_composed: "1852-04-09"
    date_published: "1854"
    acquire:
      method: api
      url: https://en.wikisource.org/wiki/Journal_of_Discourses/Volume_1/Self-Government—Mysteries,_etc.
      license: public domain (1854); Wikisource transcription under CC BY-SA
      notes: >-
        Wikisource's transcription of the 1854 Liverpool printing, read through
        the MediaWiki API. One unit per paragraph, located by volume and page.
    select: {pages: [46, 53]}
    expect: {discourse: 1}
    verify: [transcription against the 1854 scan, the printed heading (kept only in the page header)]

  - key: conference-reports-historical
    title: Conference Reports (historical, through 1970)
    work: conference-reports
    acquire: {method: scrape, notes: archive.org scans.}
    verify: [url, license per year, OCR accuracy]

  - key: general-conference-1971-present
    title: General Conference talks, 1971–present
    work: general-conference

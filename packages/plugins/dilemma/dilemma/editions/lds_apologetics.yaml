group: lds_apologetics
title: LDS apologetics (rank 5 — steelmanning and escape hatches)
brief: >-
  The tradition's own best responses, retrieved rather than invented: every
  dilemma must carry them. Online journals and wikis first; books are blocked
  pending purchase or scan. Responses to the CES Letter belong here, not with
  the critical literature.
sources:
  - key: fair-answers
    title: FAIR Answers wiki
    work: fair-answers
    acquire: {method: scrape, url: https://www.fairlatterdaysaints.org}
    verify: [terms of use, robots.txt]

  - key: fair-conference-papers
    title: FAIR conference papers
    work: fair-conference
    acquire: {method: scrape, url: https://www.fairlatterdaysaints.org}
    verify: [terms of use, robots.txt]

  - key: interpreter-journal
    title: "Interpreter: A Journal of Latter-day Saint Faith and Scholarship"
    work: interpreter-journal
    acquire: {method: scrape, url: https://journal.interpreterfoundation.org}
    verify: [license, robots.txt]

  - key: farms-review
    title: FARMS Review / Mormon Studies Review
    work: farms-review
    acquire: {method: scrape, url: https://scholarsarchive.byu.edu}
    verify: [license per article, robots.txt]

  - key: journal-of-book-of-mormon-studies
    title: Journal of Book of Mormon Studies
    work: journal-of-book-of-mormon-studies

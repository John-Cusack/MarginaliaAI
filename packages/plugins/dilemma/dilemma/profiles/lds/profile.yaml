# The Church of Jesus Christ of Latter-day Saints, as a reader of the library.
#
# Each role says what an edition is to this profile: `binding` (T1 standard
# works as canonized at the date in question; T2 First Presidency and other
# formal statements; T3 sermons of prophets and apostles), `reference` (T4
# manuals and reference works), `defense` (T5 faithful apologetics) or
# `critical` (T6, leads and evaluation only). `valid_from` is inclusive and
# `valid_to` exclusive; a window left open is unknown, not unlimited — the
# notes say what still needs verifying.
key: lds
version: 1
title: The Church of Jesus Christ of Latter-day Saints
internal_tiers: [T1, T2, T3]
cost_notes: >-
  Horns that are both T1 and canonical at the same date cost the most. Horns
  that are T3 against T1 are partly absorbed by the "speaking as a man" hatch.
roles:
  # --- Canon and its editions ---
  - {edition: bom-1830, role: binding, tier: T1, valid_from: 1830-04-06,
     notes: "Canon from the church's organization; this printing was the text then in use. End of its currency not set — verify."}
  - {edition: bom-1837, role: binding, tier: T1,
     notes: "Window of currency not set — verify."}
  - {edition: bom-1840, role: binding, tier: T1,
     notes: "Window of currency not set — verify."}
  - {edition: bom-1879, role: binding, tier: T1,

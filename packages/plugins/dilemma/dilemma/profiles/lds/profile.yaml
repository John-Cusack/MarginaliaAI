     notes: "Window of currency not set — verify."}
  - {edition: bom-2013, role: binding, tier: T1, valid_from: 2013-01-01,
     notes: "Approximate start: the 2013 edition's release year — verify."}
  - {edition: boc-1833, role: binding, tier: T1,
     notes: "Partial printing destroyed in 1833; its standing as canon before 1835 — verify."}
  - {edition: dc-1835, role: binding, tier: T1, valid_from: 1835-08-17,
     notes: "Accepted by a general assembly in Kirtland, 17 August 1835."}
  - {edition: dc-1844, role: binding, tier: T1,
     notes: "Window of currency not set — verify."}
  - {edition: dc-1876, role: binding, tier: T1,
     notes: "Window of currency not set — verify."}
  - {edition: dc-1921, role: binding, tier: T1,
     notes: "Window of currency not set — verify."}
  - {edition: dc-2013, role: binding, tier: T1, valid_from: 2013-01-01,
     notes: "Approximate start — verify."}
  - {edition: pgp-1880, role: binding, tier: T1, valid_from: 1880-10-10,
     notes: "Canonized at the October 1880 general conference."}
  - {edition: pgp-2013, role: binding, tier: T1, valid_from: 2013-01-01,
     notes: "Approximate start — verify."}
  - {edition: boa-times-and-seasons-1842, role: binding, tier: T1, valid_from: 1880-10-10,
     notes: "Canonized with the Pearl of Great Price in 1880; before that its standing — verify."}
  - {edition: od-1, role: binding, tier: T2, valid_from: 1890-10-06,
     notes: "Sustained at the October 1890 conference; printed in the D&C since — verify edition."}
  - {edition: od-2, role: binding, tier: T2, valid_from: 1978-09-30,
     notes: "Sustained 30 September 1978."}
  - {edition: jst-manuscripts, role: binding, tier: T3,
     notes: "Excerpts in LDS Bible footnotes; Moses and JS–Matthew canonized in the PGP — verify standing of the rest."}


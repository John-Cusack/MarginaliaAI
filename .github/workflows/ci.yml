name: CI

# Every push and every PR. The suite is hermetic — no database, no GPU, no
# network — so there is no reason to gate it behind a schedule or a label.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repo. The repo's default token is already read-only,
# but that is a settings toggle; saying it here keeps it true if the toggle
# moves. CodeRabbit runs zizmor over workflow changes, and an implicit token
# scope, persisted checkout credentials and tag-pinned actions are what it
# flags. Actions are pinned to the commit their major tag pointed at; the
# trailing comment is the release that commit is.
permissions:
  contents: read

jobs:
  test:
    name: unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      # `github` output turns each violation into a line annotation on the
      # check run. CodeRabbit reads failed checks back into its review, and an
      # annotation names the file and line where a log line would only say it.
      - name: Lint
        run: uv run ruff check --output-format=github packages/ tests/

      - name: Unit tests
        run: uv run pytest tests/unit -q

      # The in-tree packs under `packages/plugins/` are the reason to keep a
      # pack in this repo at all: it and the SDK change it depends on land in
      # one reviewed commit. That only holds if the pack's tests run here.
      - name: In-tree pack tests
        run: uv run pytest packages/plugins -q

# Integration tests are deliberately absent. They run against a populated
# corpus via `load_settings().db_url` and take ~19 minutes, most of it in
# checks that scan every passage — so against the empty database a service
# container would give them, they would assert almost nothing while costing
# the whole runtime. Making them CI-worthy means giving them their own
# fixture-built corpus, which is real work and belongs in its own change.
# Until then: `make test-integration` locally, against a real database.

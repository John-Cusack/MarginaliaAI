name: Release

# Publishing uses PyPI Trusted Publishing. Register a *pending* publisher per
# distribution before its first upload (https://pypi.org/manage/account/publishing/):
#
#   Project name                  Owner         Repository    Workflow     Environment
#   marginalia-ai-sdk             John-Cusack   MarginaliaAI  release.yml  pypi-sdk
#   marginalia-ai                 John-Cusack   MarginaliaAI  release.yml  pypi-core
#   marginalia-ai-plugin-history  John-Cusack   MarginaliaAI  release.yml  pypi-history
#
# Manual dispatch publishes one selected distribution to TestPyPI. A coordinated
# `v*` tag publishes SDK, core, then history; `sdk-v*` and `core-v*` tags publish
# only that distribution, so immutable sibling artifacts are never retried.
#
# marginalia-ai carries a Rust extension (research_engine._native), so core
# publishes per-platform wheels built by maturin plus an sdist that builds it
# from source; everything else stays pure Python.

on:
  push:
    tags:
      - "v*"
      - "core-v*"
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Distribution to build and publish
        required: true
        default: core
        type: choice
        options:
          - sdk
          - core
          - history
permissions:
  contents: read

jobs:
  build-sdk:
    if: >-
      (github.event_name == 'push' && !startsWith(github.ref_name, 'core-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'sdk')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --group dev
      - run: uv run pytest packages/sdk/tests -q
      - name: Verify package-specific tag
        if: github.event_name == 'push' && startsWith(github.ref_name, 'sdk-v')
        run: >-
          test "sdk-v$(uv run python -c
          'import research_engine_sdk; print(research_engine_sdk.__version__)')"
          = "$GITHUB_REF_NAME"
      - run: uv build --package marginalia-ai-sdk --out-dir dist/sdk
      - run: uvx --from twine twine check --strict dist/sdk/*
      - run: >-
          uv run --isolated --no-project
          --with dist/sdk/marginalia_ai_sdk-0.6.1-py3-none-any.whl
          python -c 'import research_engine_sdk as s; [getattr(s, n) for n in s.__all__]'
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-distributions
          path: dist/sdk/

  publish-sdk:
    needs: build-sdk
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.ref_name, 'core-v') &&
      needs.build-sdk.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-distributions
          path: dist/sdk
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdk/

  publish-sdk-testpypi:
    needs: build-sdk
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.package == 'sdk' &&
      needs.build-sdk.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-distributions
          path: dist/sdk
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdk/
          repository-url: https://test.pypi.org/legacy/

  build-core:
    needs: [publish-sdk, publish-sdk-testpypi]
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref_name, 'core-v')) ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'v') &&
      needs.publish-sdk.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'core'))
    runs-on: ubuntu-latest
    # The gate: nothing below builds or publishes unless both backends pass.
    # 3.13 because its unicodedata matches the extension's Unicode tables, so
    # `auto` exercises Rust; the second pass pins the pure-Python path.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv python install 3.13
      - run: uv sync --group dev --python 3.13
      - name: Verify package-specific tag
        if: github.event_name == 'push' && startsWith(github.ref_name, 'core-v')
        run: >-
          test "core-v$(uv run python -c
          'import research_engine; print(research_engine.__version__)')"
          = "$GITHUB_REF_NAME"
      - run: uv run ruff check packages/ tests/
      - name: Rust tests
        run: |
          export PYO3_PYTHON=$PWD/.venv/bin/python
          export LD_LIBRARY_PATH=$($PYO3_PYTHON -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          export PYTHONPATH=$($PYO3_PYTHON -c 'import os, sys; print(os.pathsep.join(p for p in sys.path if p))')
          cargo test --workspace
      - name: Unit tests, Rust backend
        run: |
          uv run python -c "from research_engine import _rust; assert _rust.backend() == 'rust'"
          uv run pytest tests/unit -q
      - name: Unit tests, Python backend
        run: RE_RUST_BACKEND=python uv run pytest tests/unit -q

  build-core-wheels:
    needs: build-core
    if: always() && needs.build-core.result == 'success'
    strategy:
      matrix:
        include:
          # manylinux containers keep the glibc floor at 2.17-era distros
          # (RHEL 8, Debian 11), not whatever the runner happens to ship.
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, smoke: false }
          - { os: macos-latest, target: aarch64, manylinux: "", smoke: true }
          - { os: macos-latest, target: x86_64, manylinux: "", smoke: false }
          - { os: windows-latest, target: x64, manylinux: "", smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv python install 3.13
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: packages/core
          # Absolute: the smoke and upload steps read the repo root.
          args: --release --out ${{ github.workspace }}/dist/core
      # The lightweight base install still pulls no ML stack, the CLI starts,
      # and `auto` engages the extension on the interpreter it matches.
      - name: Smoke the wheel without Rust
        if: matrix.smoke
        shell: bash
        run: |
          uv venv --seed --python 3.13 "$RUNNER_TEMP/re-base"
          py="$RUNNER_TEMP/re-base/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/re-base/Scripts/python.exe"
          uv pip install --python "$py" marginalia-ai-sdk==0.6.1 dist/core/marginalia_ai-*.whl
          "$py" -c 'from importlib.util import find_spec; assert find_spec("torch") is None; assert find_spec("docling") is None; assert find_spec("sentence_transformers") is None'
          "$py" -c 'from research_engine import _rust, _native; assert _native.BUILD_PROFILE == "release"; assert _rust.backend() == "rust"; assert _native.text.normalize("fis-\ncal") == "fiscal"'
          bin="$(dirname "$py")"
          "$bin/research-engine" --help
          "$bin/research-engine" config --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-distributions-${{ matrix.os }}-${{ matrix.target }}
          path: dist/core/
          if-no-files-found: error

  build-core-sdist:
    needs: build-core
    if: always() && needs.build-core.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build sdist
        working-directory: packages/core
        run: uvx --from 'maturin>=1.15,<2' maturin sdist --out "$GITHUB_WORKSPACE/dist/core"
      - run: uvx --from twine twine check --strict dist/core/*
      # Platforms without a prebuilt wheel install from this: it must build.
      - name: Build a wheel from the sdist
        run: |
          uv python install 3.13
          uv venv --python 3.13 "$RUNNER_TEMP/from-sdist"
          uv pip install --python "$RUNNER_TEMP/from-sdist/bin/python" marginalia-ai-sdk==0.6.1 dist/core/marginalia_ai-*.tar.gz
          "$RUNNER_TEMP/from-sdist/bin/python" -c 'from research_engine import _rust; assert _rust.backend() == "rust"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-distributions-sdist
          path: dist/core/
          if-no-files-found: error

  publish-core:
    needs: [build-core-wheels, build-core-sdist]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.build-core-wheels.result == 'success' &&
      needs.build-core-sdist.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: core-distributions-*
          path: dist/core
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/core/

  publish-core-testpypi:
    needs: [build-core-wheels, build-core-sdist]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.package == 'core' &&
      needs.build-core-wheels.result == 'success' &&
      needs.build-core-sdist.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: core-distributions-*
          path: dist/core
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/core/
          repository-url: https://test.pypi.org/legacy/

  build-history:
    needs: [publish-core, publish-core-testpypi]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.package == 'history') ||
      (github.event_name == 'push' &&
      !startsWith(github.ref_name, 'core-v') &&
      needs.publish-core.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --group dev
      - run: uv run pytest packages/plugins/history/tests -q
      - run: uv build --package marginalia-ai-plugin-history --out-dir dist/history
      - run: uvx --from twine twine check --strict dist/history/*
      - name: Smoke production SDK/core/history artifacts
        run: |
          uv venv --seed /tmp/re-history
          uv pip install --python /tmp/re-history/bin/python marginalia-ai-sdk==0.6.1 marginalia-ai==0.6.2 dist/history/marginalia_ai_plugin_history-0.2.0-py3-none-any.whl
          /tmp/re-history/bin/python -c 'from research_engine.plugins.discovery import discover_plugins; p=discover_plugins(); assert [x.plugin_id for x in p] == ["history"]'
      - uses: actions/upload-artifact@v4
        with:
          name: history-distributions
          path: dist/history/

  publish-history:
    needs: build-history
    if: >-
      always() &&
      github.event_name == 'push' &&
      !startsWith(github.ref_name, 'core-v') &&
      needs.build-history.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi-history
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: history-distributions
          path: dist/history
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/history/

  publish-history-testpypi:
    needs: build-history
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.package == 'history' &&
      needs.build-history.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi-history
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: history-distributions
          path: dist/history
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/history/
          repository-url: https://test.pypi.org/legacy/

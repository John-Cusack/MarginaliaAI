name: Release

# Publishing uses PyPI Trusted Publishing. Register a *pending* publisher per
# distribution before its first upload (https://pypi.org/manage/account/publishing/):
#
#   Project name                  Owner         Repository    Workflow     Environment
#   marginalia-ai-sdk             John-Cusack   MarginaliaAI  release.yml  pypi-sdk
#   marginalia-ai                 John-Cusack   MarginaliaAI  release.yml  pypi-core
#   marginalia-ai-plugin-history  John-Cusack   MarginaliaAI  release.yml  pypi-history
#
# The same values apply on TestPyPI (https://test.pypi.org/manage/account/publishing/)
# once a TestPyPI upload job exists; this workflow publishes to production PyPI only.
# Create the three environments under Settings → Environments, with required
# reviewers, before the first tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --group dev
      - run: uv run pytest packages/sdk/tests -q
      - run: uv build --package marginalia-ai-sdk --out-dir dist/sdk
      - run: uvx --from twine twine check --strict dist/sdk/*
      - run: >-
          uv run --isolated --no-project
          --with dist/sdk/marginalia_ai_sdk-0.6.0-py3-none-any.whl
          python -c 'import research_engine_sdk as s; [getattr(s, n) for n in s.__all__]'
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-distributions
          path: dist/sdk/

  publish-sdk:
    needs: build-sdk
    runs-on: ubuntu-latest
    environment: pypi-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-distributions
          path: dist/sdk
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdk/

  build-core:
    needs: publish-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --group dev
      - run: uv run ruff check packages/ tests/
      - run: uv run pytest tests/unit -q
      - run: uv build --package marginalia-ai --out-dir dist/core
      - run: uvx --from twine twine check --strict dist/core/*
      - name: Smoke lightweight base artifact
        run: |
          uv venv --seed /tmp/re-base
          uv pip install --python /tmp/re-base/bin/python marginalia-ai-sdk==0.6.0 dist/core/marginalia_ai-0.6.0-py3-none-any.whl
          /tmp/re-base/bin/python -c 'from importlib.util import find_spec; assert find_spec("torch") is None; assert find_spec("docling") is None; assert find_spec("sentence_transformers") is None'
          /tmp/re-base/bin/research-engine --help
          /tmp/re-base/bin/research-engine config --help
      - uses: actions/upload-artifact@v4
        with:
          name: core-distributions
          path: dist/core/

  publish-core:
    needs: build-core
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-distributions
          path: dist/core
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core/

  build-history:
    needs: publish-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --group dev
      - run: uv run pytest packages/plugins/history/tests -q
      - run: uv build --package marginalia-ai-plugin-history --out-dir dist/history
      - run: uvx --from twine twine check --strict dist/history/*
      - name: Smoke production SDK/core/history artifacts
        run: |
          uv venv --seed /tmp/re-history
          uv pip install --python /tmp/re-history/bin/python marginalia-ai-sdk==0.6.0 marginalia-ai==0.6.0 dist/history/marginalia_ai_plugin_history-0.2.0-py3-none-any.whl
          /tmp/re-history/bin/python -c 'from research_engine.plugins.discovery import discover_plugins; p=discover_plugins(); assert [x.plugin_id for x in p] == ["history"]'
      - uses: actions/upload-artifact@v4
        with:
          name: history-distributions
          path: dist/history/

  publish-history:
    needs: build-history
    runs-on: ubuntu-latest
    environment: pypi-history
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: history-distributions
          path: dist/history
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/history/

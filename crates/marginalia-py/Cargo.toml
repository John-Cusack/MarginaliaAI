[package]
name = "marginalia-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "marginalia_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
marginalia-text = { path = "../marginalia-text" }
marginalia-chunk = { path = "../marginalia-chunk" }
pyo3 = { version = "0.24", features = ["abi3-py311"] }
serde_json = { workspace = true }
marginalia-types = { path = "../marginalia-types" }
marginalia-parse = { path = "../marginalia-parse" }

